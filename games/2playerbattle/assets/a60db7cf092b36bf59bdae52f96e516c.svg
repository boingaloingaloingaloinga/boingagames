<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="488.47005" height="374.34766" viewBox="0,0,488.47005,374.34766"><g transform="translate(4.23502,10.84766)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-4.23502,363.5v-367h488.47005v367z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(59.11672,45.79587) scale(1.30215,1.30215)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">BATTLE NEWS</tspan></text><path d="M-2.94098,56.48161h484" data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M112.05938,356.01037v-28h240v28z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(114.05938,350.17202) scale(0.5,0.5)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#0d9900" fill-rule="nonzero" stroke="#0d9900" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">&lt; CLICK HERE TO CLOSE &gt;</tspan></text><path d="M482.05918,330.05422h-485.059" data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><text transform="translate(3.33848,75.28412) scale(0.48512,0.48512)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#8d00ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Saving and loading is here!</tspan></text><text transform="translate(3.89738,94.51525) scale(0.33208,0.33208)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">It has been almost 2 years since I removed the ability to save your progress, and today</tspan><tspan x="0" dy="48px">it is finally back in the game!</tspan><tspan x="0" dy="48px">In the top right corner of the menu you can save and load your progress using a </tspan><tspan x="0" dy="48px">save code. </tspan><tspan x="0" dy="48px">If there are any problems with it, please tell me in the comments so I can fix it.</tspan></text><text transform="translate(354.32439,73.49025) scale(0.40921,0.40921)" font-size="40" xml:space="preserve" fill="#002bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">6 - February- 2022</tspan></text><text transform="translate(5.89749,194.0349) scale(0.36083,0.36083)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Enjoy!</tspan></text></g></g></svg>