<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="488.47005" height="374.34766" viewBox="0,0,488.47005,374.34766"><g transform="translate(4.23499,10.84765)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-4.23499,363.5v-367h488.47005v367z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(59.1167,45.79587) scale(1.30215,1.30215)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">BATTLE NEWS</tspan></text><path d="M-2.94099,56.48161h484" data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M112.0593,356.01037v-28h240v28z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(114.0593,350.17202) scale(0.5,0.5)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#0d9900" fill-rule="nonzero" stroke="#0d9900" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">&lt; CLICK HERE TO CLOSE &gt;</tspan></text><path d="M-2.99991,330.05422h485.059" data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><text transform="translate(3.33847,75.28412) scale(0.48512,0.48512)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#8d00ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Summer update!</tspan></text><text transform="translate(3.89737,90.26525) scale(0.29736,0.29736)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">New characters:</tspan><tspan x="0" dy="48px">- Icecream Seller (common): makes the opponent slippery, which makes it hard for them to move.</tspan><tspan x="0" dy="48px">- DJ (rare): His attack is a big soundwave that pushes the opponent back.</tspan><tspan x="0" dy="48px">- Slime Pirate (legendary): Throws slimes that stick to the opponent and constantly deal damage.</tspan><tspan x="0" dy="48px">The opponent can get rid of the slime by rubbing it to a wall.</tspan><tspan x="0" dy="48px">- Lava Monster (legendary): His attack splits into 4 mines. He moves slower than other characters.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">New gamemode: Deathmatch! First to 5 kills wins. If the timer runs out, the player with the most</tspan><tspan x="0" dy="48px">kills wins.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">The winner of the Jerry skin contest is Frost Shaman made by Wormotron! Congrats!</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Second slide for balance changes</tspan></text><text transform="translate(371.32427,73.49025) scale(0.40921,0.40921)" font-size="40" xml:space="preserve" fill="#002bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">30 - July - 2021</tspan></text><text transform="translate(42.89746,314.0349) scale(0.36083,0.36083)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Enjoy!</tspan></text><g fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round"><path d="M167.66169,258.92856h19.5"/><path d="M182.55888,254.05601l4.86207,4.86207l-4.60345,4.60345"/></g></g></g></svg>