<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="488.47005" height="374.34766" viewBox="0,0,488.47005,374.34766"><g><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-4.23502,363.5v-367h488.47005v367z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,4.23502,10.84765)"/><text transform="matrix(1.30215,0,0,1.30215,63.3516,56.64352)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">BATTLE NEWS</tspan></text><path d="M 1.294 67.3293 L 485.294 67.3293 " data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M112.05899,356.01039v-28h240v28z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,4.23502,10.84765)"/><text transform="matrix(0.5,0,0,0.5,118.29401,361.01968)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#0d9900" fill-rule="nonzero" stroke="#0d9900" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">&lt; CLICK HERE TO CLOSE &gt;</tspan></text><path d="M 486.294 340.9019 L 1.235 340.9019 " data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><text transform="matrix(0.48512,0,0,0.48512,7.573459999999999,88.63177)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#8d00ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Summer event!</tspan></text><text transform="matrix(0.36083,0,0,0.36083,8.132359999999998,115.3976)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Both players now have a treasure map! You progress through the treasure map</tspan><tspan x="0" dy="48px">by winning matches. You will collect gold as well as 4 new pirate characters as </tspan><tspan x="0" dy="48px">you progress further.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">But that's not all! There are 2 more summer related characters! The basketballer</tspan><tspan x="0" dy="48px">(legendary rarity) and the surfer (mythic rarity).</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">All 6 new characters were designed by Jolly08!</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">New updates often bring bugs too. If you find any, please report it in the</tspan><tspan x="0" dy="48px">comments so I can fix it.</tspan></text><text transform="matrix(0.40921,0,0,0.40921,362.55899,88.8379)" font-size="40" xml:space="preserve" fill="#002bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">2 - August - 2020</tspan></text><text transform="matrix(0.39896,0,0,0.39896,216.73502,330.01340999999996)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Enjoy!</tspan></text></g></g></svg>