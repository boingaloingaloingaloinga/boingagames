-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">&lt; CLICK HERE TO CLOSE &gt;</tspan></text><path d="M 488.559 340.9019 L 3.5 340.9019 " data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><text transform="matrix(0.48512,0,0,0.48512,9.838470000000001,88.63177)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#8d00ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">The balance changes</tspan></text><path d="M11.13397,108.76295v-10.09712h145.92312v10.09712z" fill="#ffb0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.13397,118.53436v-10.09712h294.45389v10.09712z" fill="#ffb0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.14377,128.63149v-10.42284h289.22878v10.42284z" fill="#ffb0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.14377,139.27146v-10.9657h217.57595v10.9657z" fill="#ffb0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M12.13762,271.97999v-10.42284h119.42139v10.42284z" fill="#ffb0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M12.13762,282.40282v-10.42284h143.63285v10.42284z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.80064,292.17423v-10.74855h284.64823v10.74855z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M228.44399,139.21784v-10.42284h164.63132v10.42284z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.10361,149.28985v-10.74855h103.7575v10.74855z" fill="#ffb0b0" stroke="#000000" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.02107,159.8887v-10.74855h205.47794v10.74855z" fill="#ffb0b0" stroke="#000000" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.02107,170.36428v-10.74855h243.85522v10.74855z" fill="#ffb0b0" stroke="#000000" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><text transform="matrix(0.40921,0,0,0.40921,378.82397,88.8379)" font-size="40" xml:space="preserve" fill="#002bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">4 - April - 2021</tspan></text><path d="M11.11066,180.88451v-10.42284h196.29799v10.42284z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.11066,190.88451v-10.42284h157.29799v10.42284z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.11066,200.88451v-10.42284h242.96466v10.42284z" fill="#ffe0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.11066,211.21784v-10.42284h294.29799v10.42284z" fill="#ffe0b0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M52.44399,221.55117v-10.42284h238.96466v10.42284z" fill="#b0fffa" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.77732,231.88451v-10.42284h138.29799v10.42284z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M11.68774,242.36428v-10.74855h129.52189v10.74855z" fill="#ffb0b0" stroke="#000000" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M291.3544,221.69761v-10.74855h72.18855v10.74855z" fill="#ffb0b0" stroke="#000000" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><path d="M363.50459,221.33905v-10.42284h116.02526v10.42284z" fill="#bbffb0" stroke="none" stroke-width="0" stroke-linecap="butt" transform="matrix(1,0,0,1,6.5,10.84765)"/><text transform="matrix(0.21337,0,0,0.21241,11.798269999999999,106.55445)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="0.5" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">General balance changes:</tspan><tspan x="0" dy="48px"> - Miner: his damage now has a limit of 40.</tspan><tspan x="0" dy="48px"> - Gea: damage reduced from 10 to 8 and she now has a max amount of projectiles of 4.</tspan><tspan x="0" dy="48px"> - Teleporter: damage reduced from 20 to 18 and reload speed from 1.5 to 1.6 seconds.</tspan><tspan x="0" dy="48px"> - Alien: damage from 15 to 13, reload speed from 1.2 to 1.5 sec.  Its projectiles will now lock onto the opponent.</tspan><tspan x="0" dy="48px"> - Pirate: damage from 20 to 17.</tspan><tspan x="0" dy="48px"> - Ghost: now goes invisible 5 seconds after shooting (was 3).</tspan><tspan x="0" dy="48px"> - Flare: damage (from fire) reduced from 4 to 3 damage per 1/2 seconds.</tspan><tspan x="0" dy="48px"> - Double gunner: damage increased from 5 to 6 per bullet.</tspan><tspan x="0" dy="48px"> - Boxer: damage increased from 6 to 7 per fist.</tspan><tspan x="0" dy="48px"> - Imposter: damage from 9 to 10, but reload speed from 0,8 to 1 second.</tspan><tspan x="0" dy="48px"> - Boomerang thrower: damage from 15 to 14, but reload speed from 1,5 to 1,2 seconds.</tspan><tspan x="0" dy="48px"> - John Wick: His bullet now shoot straight, so the laser aim thing is actually useful. Damage from 8 to 6. His bullets are now twice as fast.</tspan><tspan x="0" dy="48px"> - Sprayer: Damage from 2 to 4 per bullet.</tspan><tspan x="0" dy="48px"> - Basketballer: Damage from 15 to 12.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">Boss fight balance changes:</tspan><tspan x="0" dy="48px"> - Healing is now 50% less effective</tspan><tspan x="0" dy="48px"> - Poison deals 2x more damage to the boss.</tspan><tspan x="0" dy="48px"> - Captain Shield's shield now blocks the boss attacks (which also damages the boss).</tspan></text></g></g></svg>