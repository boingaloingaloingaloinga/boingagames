<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="488.47005" height="374.34766" viewBox="0,0,488.47005,374.34766"><g transform="translate(4.23502,10.84765)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M-4.23502,363.5v-367h488.47005v367z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(59.11658,45.79587) scale(1.30215,1.30215)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="#000000" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">BATTLE NEWS</tspan></text><path d="M-2.94102,56.48162h484" data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><path d="M112.05918,356.01038v-28h240v28z" fill="#f1f1f1" stroke="none" stroke-width="0" stroke-linecap="butt"/><text transform="translate(114.05918,350.17202) scale(0.5,0.5)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#0d9900" fill-rule="nonzero" stroke="#0d9900" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">&lt; CLICK HERE TO CLOSE &gt;</tspan></text><path d="M-2.99994,330.05422h485.059" data-paper-data="{&quot;origPos&quot;:null}" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/><text transform="translate(3.33844,75.28412) scale(0.48512,0.48512)" font-size="40" xml:space="preserve" data-paper-data="{&quot;origPos&quot;:null}" fill="#8d00ff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Forest duo! ...and a walking bomb?</tspan></text><text transform="translate(3.89734,89.66903) scale(0.2808,0.2808)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">- Splinter (common): He likes to chop down trees. Because of that the forest guard is often after him.</tspan><tspan x="0" dy="48px">He shoots splinters with his wooden gun. The splinters give a permanent bleeding effect to the opponent.</tspan><tspan x="0" dy="48px">The bleeding effect increases with every hit, so the opponent starts taking more and more damage.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">- Forest Guard (rare): This is the forest guard that is hunting Splinter. Similar to the Summoner, he </tspan><tspan x="0" dy="48px">can charge his attack if you hold down the attack button. The longer you hold, the more damage it deals.</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">- Minelayer (epic): After the Minelayer had accidently created the Walking Bomb, he prisoned the Bomb.</tspan><tspan x="0" dy="48px">But the Bomb has now escaped, and the Minelayer is using mines to try and catch it!</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">- Walking Bomb (common): He's too dangerous to be free. But... he's free anyway? That can't be good...</tspan><tspan x="0" dy="48px"> </tspan><tspan x="0" dy="48px">- Some improvements to the Settings.</tspan><tspan x="0" dy="48px">- The map 'potato' got a very fun little rework ;)</tspan></text><text transform="translate(371.32416,73.49025) scale(0.40921,0.40921)" font-size="40" xml:space="preserve" fill="#002bff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">14 - July - 2021</tspan></text><text transform="translate(42.89734,314.03491) scale(0.36083,0.36083)" font-size="40" xml:space="preserve" fill="#000000" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">Enjoy!</tspan></text></g></g></svg>